<!doctype html>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #1a1a19; --quiet: #6b6a66; --faint: #9a9994;
    --page: #faf9f7; --line: #e6e4df;
    --waiting: #b5760f; --moving: #1d7a5f; --settled: #a8a6a1;
    --measure: 34rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #edecea; --quiet: #9d9b96; --faint: #6e6c68;
      --page: #171715; --line: #2c2b28;
      --waiting: #e0a33f; --moving: #57bb98; --settled: #55534f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 5rem 2rem 6rem;
  }
  main { max-width: var(--measure); margin: 0 auto; }

  .situation { color: var(--quiet); font-size: .9rem; margin: 0 0 3.25rem; }

  .rank { margin: 0 0 3rem; }
  .rank-name {
    font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 1.1rem;
    display: flex; align-items: center; gap: .55rem;
  }
  .mark { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .waiting .mark { background: var(--waiting); }
  .moving  .mark { background: var(--moving); }
  .settled .mark { background: var(--settled); }

  .effort {
    padding: .15rem 0 .15rem 1rem; margin: 0 0 1.6rem;
    border-left: 2px solid transparent; cursor: default;
    outline: none;
  }
  .waiting .effort { border-left-color: var(--waiting); }
  .moving  .effort { border-left-color: color-mix(in srgb, var(--moving) 45%, transparent); }
  .settled .effort { border-left-color: transparent; padding-left: 1rem; }

  .effort:focus-visible, .effort[data-here="1"] {
    background: color-mix(in srgb, var(--ink) 4%, transparent);
    border-radius: 0 3px 3px 0;
  }

  .intent { margin: 0; font-weight: 500; }
  .settled .intent { font-weight: 400; color: var(--quiet); }
  .says { margin: .2rem 0 0; color: var(--quiet); font-size: .92rem; }
  .ours { color: var(--faint); }
  .under { margin: .35rem 0 0; color: var(--faint); font-size: .8rem; }
  .folded { margin: 0; padding-left: 1rem; color: var(--faint); font-size: .88rem; }

  .empty { margin: 6rem 0 0; }
  .empty p { margin: 0 0 1.5rem; color: var(--quiet); }

  .hint { color: var(--faint); font-size: .78rem; }
  kbd {
    font: inherit; font-size: .72rem; color: var(--faint);
    border: 1px solid var(--line); border-radius: 3px; padding: 0 .3rem;
  }

  #speak {
    position: fixed; inset: 0; display: none; place-items: start center;
    padding-top: 22vh; background: color-mix(in srgb, var(--page) 82%, transparent);
    backdrop-filter: blur(3px);
  }
  #speak[data-open="1"] { display: grid; }
  #speak form { width: min(var(--measure), calc(100vw - 4rem)); }
  #speak input {
    width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink);
    background: transparent; border: none; border-bottom: 2px solid var(--line);
    padding: .5rem 0; outline: none;
  }
  #speak input:focus { border-bottom-color: var(--quiet); }
  #speak .hint { margin-top: .8rem; display: block; }

  #footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem 2rem;
            text-align: center; background: linear-gradient(transparent, var(--page) 55%); }
</style>

<main id="home" aria-live="polite"></main>

<div id="speak"><form><input autocomplete="off" spellcheck="false"><span class="hint"></span></form></div>

<div id="footer"><span class="hint">
  <kbd>n</kbd> begin &nbsp; <kbd>↑↓</kbd> move &nbsp; <kbd>a</kbd> accept &nbsp;
  <kbd>r</kbd> redirect &nbsp; <kbd>x</kbd> let go &nbsp; <kbd>d</kbd> send to an assistant
</span></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const api = async (path, body) => (await fetch(path, body
  ? { method: 'POST', body: JSON.stringify(body) } : undefined)).json();

let picture = null;
let here = 0;

const flat = () => picture ? picture.ranks.flatMap((r) => r.efforts) : [];

function draw() {
  const m = $('#home');
  if (!picture || picture.empty) {
    m.innerHTML = `<div class="empty"><p>${picture ? picture.situation : ''}</p>
      <span class="hint">press <kbd>n</kbd> to begin an effort</span></div>`;
    return;
  }

  const all = flat();
  here = Math.max(0, Math.min(here, all.length - 1));
  let i = -1;

  m.innerHTML = `<p class="situation">${esc(picture.situation)}</p>` + picture.ranks.map((r) => {
    const cls = r.name === 'waiting on you' ? 'waiting' : r.name === 'moving' ? 'moving' : 'settled';
    const rows = r.efforts.map((e) => {
      i++;
      const said = e.says ?? e.account;
      return `<div class="effort" tabindex="0" data-i="${i}" data-id="${e.id}"
                   data-here="${i === here ? 1 : 0}">
        <p class="intent">${esc(e.intent)}</p>
        ${said ? `<p class="says${e.accountIsOurs ? ' ours' : ''}">${esc(said)}</p>` : ''}
        <p class="under">${[e.action, e.assistant, e.ago].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ')}</p>
      </div>`;
    }).join('');
    const folded = r.compressed ? `<p class="folded">${esc(r.compressed.sentence)}</p>` : '';
    return `<section class="rank ${cls}">
      <p class="rank-name"><span class="mark"></span>${esc(r.name)}</p>${rows}${folded}</section>`;
  }).join('');
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function refresh() { picture = await api('/home'); draw(); }

// Speaking to the current surface. Never a place; summoned, spoken to, dismissed.
function ask(prompt, hint, done) {
  const box = $('#speak'), input = box.querySelector('input');
  box.querySelector('.hint').textContent = hint ?? '';
  input.placeholder = prompt; input.value = '';
  box.dataset.open = '1'; input.focus();
  box.querySelector('form').onsubmit = async (ev) => {
    ev.preventDefault();
    const said = input.value.trim();
    box.dataset.open = '0';
    if (said) await done(said);
  };
}
$('#speak').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('#speak').dataset.open = '0'; e.stopPropagation(); }
});

const current = () => flat()[here] ?? null;
const act = async (path, body) => { picture = (await api(path, body)).home; draw(); };

addEventListener('keydown', async (e) => {
  if ($('#speak').dataset.open === '1') return;
  const it = current();

  switch (e.key) {
    case 'n':
      return ask('what needs doing?', 'enter to hand it to an assistant · shift-enter to set it aside',
        (intent) => act('/begin', { intent, then: e.shiftKey ? 'park' : 'claude' }));

    case 'ArrowDown': case 'j': here++; draw(); return;
    case 'ArrowUp':   case 'k': here--; draw(); return;

    case 'a': if (it) return act('/accept', { effort: it.id }); return;
    case 'x': if (it) return ask(`let go of "${it.intent}"?`, 'type yes to discard this work',
        (said) => said.toLowerCase() === 'yes' ? act('/abandon', { effort: it.id }) : null); return;
    case 'r': if (it) return ask('what should change?', '',
        (direction) => act('/redirect', { effort: it.id, direction })); return;
    case 'd': if (it) return ask('which assistant?', 'claude · codex · gemini · aider',
        (assistant) => act('/delegate', { effort: it.id, assistant })); return;
    case 'p': if (it) return act('/park', { effort: it.id }); return;
  }
});

await refresh();
// The picture catches up quietly. Nothing here ever asks for attention.
setInterval(refresh, 4000);
</script>
