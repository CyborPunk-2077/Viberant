<!doctype html>
<meta charset="utf-8">
<title>Projects</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink:#1a1a19; --quiet:#6b6a66; --faint:#9a9994;
    --page:#faf9f7; --card:#fff; --line:#e6e4df; --hover:#f2f0ec;
    --live:#1d7a5f; --attention:#b5760f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#edecea; --quiet:#9d9b96; --faint:#6e6c68;
            --page:#171715; --card:#1f1e1c; --line:#2c2b28; --hover:#262522;
            --live:#57bb98; --attention:#e0a33f; }
  }
  *{box-sizing:border-box} html,body{margin:0;min-height:100%}
  body{background:var(--page);color:var(--ink);padding:3.5rem 1.5rem 4rem;
       font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  main{max-width:44rem;margin:0 auto}
  h1{font-size:1.15rem;font-weight:500;margin:0 0 .25rem}
  .sub{color:var(--quiet);font-size:.85rem;margin:0 0 2.25rem}
  .group{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
         margin:2.5rem 0 .9rem}
  .row{display:flex;align-items:center;gap:.85rem;padding:.7rem .9rem;border-radius:8px;
       border:1px solid var(--line);background:var(--card);margin-bottom:.5rem;cursor:pointer}
  .row:hover{background:var(--hover)}
  .row .grow{flex:1;min-width:0}
  .row .name{font-weight:500}
  .row .note{color:var(--quiet);font-size:.82rem;margin-top:.1rem;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
  .dot.live{background:var(--live)} .dot.attention{background:var(--attention)}
  button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);
         border-radius:7px;padding:.4rem .8rem;cursor:pointer}
  button:hover{background:var(--hover)}
  button.plain{border-color:transparent;color:var(--quiet);padding:.25rem .5rem;font-size:.82rem}
  button.go{border-color:var(--ink)}
  .bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:0 0 1rem}
  input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
        border-radius:7px;padding:.45rem .7rem;outline:none;min-width:0}
  input:focus{border-color:var(--quiet)}
  .accounts{position:relative}
  .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:5;min-width:12rem;
        background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.3rem;
        box-shadow:0 6px 24px rgba(0,0,0,.12)}
  .menu[hidden]{display:none}
  .menu div{padding:.4rem .6rem;border-radius:5px;cursor:pointer;font-size:.88rem}
  .menu div:hover{background:var(--hover)}
  .menu .on{color:var(--live)}
  .menu hr{border:none;border-top:1px solid var(--line);margin:.3rem 0}
  .said{margin:1rem 0 0;padding:.7rem .9rem;border-radius:8px;background:var(--card);
        border:1px solid var(--line);font-size:.88rem}
  .said b{font-weight:500;display:block}
  .said span{color:var(--quiet)}
  .back{color:var(--quiet);font-size:.85rem;cursor:pointer;margin:0 0 1.5rem;display:inline-block}
  .empty{color:var(--quiet);margin:1rem 0 0}
</style>

<main id="view"></main>

<script type="module">
const $ = (s)=>document.querySelector(s);
const api = async (p,b)=>(await fetch(p,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:undefined)).json();
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let said = null;
const say = (r)=>{ said = r && r.sentence ? r : null; };

function saidHtml(){
  if(!said) return '';
  return `<div class="said"><b>${esc(said.sentence)}</b>${said.action?`<span>${esc(said.action)}</span>`:''}</div>`;
}

// ---------------------------------------------------------------- projects

async function showProjects(){
  const d = await api('/projects');
  $('#view').innerHTML = `
    <h1>Your projects</h1>
    <p class="sub">${d.github ? `Signed in to GitHub as ${esc(d.github)}` : 'Not signed in to GitHub on this computer'}</p>
    <div class="bar">
      <input id="path" placeholder="D:\\path\\to\\a\\folder" style="flex:1">
      <button class="go" id="add">Open</button>
      <button id="scan">Look in a folder</button>
    </div>
    ${saidHtml()}
    ${d.projects.length?`<p class="group">Recent</p>`:'<p class="empty">Nothing yet. Put a folder path above and open it.</p>'}
    ${d.projects.map(p=>`
      <div class="row" data-path="${esc(p.path)}">
        <span class="dot ${p.unsaved?'attention':''}"></span>
        <div class="grow"><div class="name">${esc(p.name)}</div>
          <div class="note">${esc(p.says)} &nbsp;·&nbsp; ${esc(p.path)}</div></div>
      </div>`).join('')}`;
  said = null;

  $('#add').onclick = ()=>openProject($('#path').value.trim());
  $('#path').onkeydown = (e)=>{ if(e.key==='Enter') openProject($('#path').value.trim()); };
  $('#scan').onclick = async ()=>{
    const r = await api('/look?in='+encodeURIComponent($('#path').value.trim()));
    if(!r.found.length){ say({sentence:'No projects in there.',action:'Try the folder that holds your projects.'}); return showProjects(); }
    for(const f of r.found) await api('/open',{path:f.path});
    await api('/open',{path:r.found[0].path});
    showProjects();
  };
  for(const row of document.querySelectorAll('.row[data-path]'))
    row.onclick = ()=>openProject(row.dataset.path);
}

async function openProject(path){
  if(!path) return;
  const r = await api('/open',{path});
  if(r.ok===false){ say(r); return showProjects(); }
  showProject();
}

// ---------------------------------------------------------------- one project

async function showProject(){
  const p = await api('/project');
  if(!p.open) return showProjects();
  const t = await api('/tools');

  const efforts = p.home.ranks.flatMap(r=>r.efforts.map(e=>({...e,rank:r.name})));

  $('#view').innerHTML = `
    <span class="back" id="back">← all projects</span>
    <h1>${esc(p.name)}</h1>
    <p class="sub">${esc(p.says)} &nbsp;·&nbsp; ${esc(p.dir)}</p>

    <div class="bar">
      <input id="msg" placeholder="What did you do?" style="flex:1">
      <button class="go" id="pub">Save and send to GitHub</button>
    </div>
    ${saidHtml()}

    <p class="group">Open this project in</p>
    ${t.tools.length ? t.tools.map(x=>`
      <div class="row" data-tool="${esc(x.id)}">
        <span class="dot"></span>
        <div class="grow"><div class="name">${esc(x.name)}</div>
          <div class="note">${x.active?`Using ${esc(x.active)}`:(x.signedIn?'Signed in':'Not signed in yet')}</div></div>
        ${x.config?`<div class="accounts">
          <button class="plain" data-menu="${esc(x.id)}">accounts ▾</button>
          <div class="menu" hidden id="m-${esc(x.id)}">
            ${x.profiles.map(pr=>`<div data-use="${esc(x.id)}" data-name="${esc(pr.name)}"
                 class="${pr.active?'on':''}">${pr.active?'✓ ':''}${esc(pr.name)}</div>`).join('')
              || '<div style="color:var(--faint)">none saved yet</div>'}
            <hr><div data-save="${esc(x.id)}">Save the one I'm signed in to…</div>
          </div></div>`:''}
      </div>`).join('')
      : '<p class="empty">None of the AI apps were found on this computer.</p>'}

    ${efforts.length?`<p class="group">Going on here</p>`:''}
    ${efforts.map(e=>`
      <div class="row">
        <span class="dot ${e.rank==='moving'?'live':(e.rank==='waiting on you'?'attention':'')}"></span>
        <div class="grow"><div class="name">${esc(e.intent)}</div>
          <div class="note">${esc(e.says||e.account||e.rank)} &nbsp;·&nbsp; ${esc(e.ago)}</div></div>
        ${e.rank!=='settled'?`<button class="plain" data-done="${esc(e.id)}">done</button>
        <button class="plain" data-drop="${esc(e.id)}">drop</button>`:''}
      </div>`).join('')}`;
  said = null;

  $('#back').onclick = showProjects;
  $('#pub').onclick = async ()=>{ say(await api('/publish',{message:$('#msg').value.trim()})); showProject(); };
  $('#msg').onkeydown = (e)=>{ if(e.key==='Enter') $('#pub').click(); };

  for(const row of document.querySelectorAll('.row[data-tool]'))
    row.onclick = async (e)=>{
      if(e.target.closest('.accounts')) return;
      say(await api('/launch',{tool:row.dataset.tool})); showProject();
    };

  for(const b of document.querySelectorAll('[data-menu]'))
    b.onclick = (e)=>{ e.stopPropagation();
      const m = $('#m-'+b.dataset.menu);
      for(const o of document.querySelectorAll('.menu')) if(o!==m) o.hidden=true;
      m.hidden = !m.hidden; };

  for(const d of document.querySelectorAll('[data-use]'))
    d.onclick = async (e)=>{ e.stopPropagation();
      say(await api('/profile/use',{tool:d.dataset.use,name:d.dataset.name})); showProject(); };

  for(const d of document.querySelectorAll('[data-save]'))
    d.onclick = async (e)=>{ e.stopPropagation();
      const name = prompt('Call this account what?');
      if(name){ say(await api('/profile/save',{tool:d.dataset.save,name})); showProject(); } };

  for(const b of document.querySelectorAll('[data-done]'))
    b.onclick = async (e)=>{ e.stopPropagation(); await api('/done',{effort:b.dataset.done}); showProject(); };
  for(const b of document.querySelectorAll('[data-drop]'))
    b.onclick = async (e)=>{ e.stopPropagation(); await api('/drop',{effort:b.dataset.drop}); showProject(); };
}

addEventListener('click',()=>{ for(const m of document.querySelectorAll('.menu')) m.hidden=true; });

const start = await api('/project');
start.open ? showProject() : showProjects();
</script>
